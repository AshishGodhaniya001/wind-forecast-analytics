services:
  backend:
    build:
      context: ./backend
    environment:
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      - backend
    ports:
      - "8080:80"
